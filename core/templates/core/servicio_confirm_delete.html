
{% extends 'core/base.html' %}

{% block titulo %}Eliminar servicio{% endblock %}

{% block contenido %}
<h1 class="text-xl font-bold mb-4">Eliminar servicio</h1>

<p class="mb-4">
    ¿Seguro que deseas eliminar este servicio?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit"
        class="bg-red-600 text-white px-4 py-2 rounded-lg">
        Sí, eliminar
    </button>

    <a href="{% url 'servicios' %}"
       class="text-blue-600 underline ml-3">
        Cancelar
    </a>
</form>
{% endblock %}
